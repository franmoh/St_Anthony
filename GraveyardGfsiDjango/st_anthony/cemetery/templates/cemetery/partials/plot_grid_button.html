{# Kept compact and cheap: rendered once per plot. Colours come from .plot-btn[data-plot-status] in styles.css; hx-target/hx-swap are inherited from the grid; p.detail_url is precomputed by the view (OOB swaps fall back to {% url %}). #}
{% load l10n %}{% localize off %}<td id="plot-grid-{{ p.pk }}" class="plot-cell"{% if hx_swap_oob %} hx-swap-oob="{{ hx_swap_oob }}"{% endif %}><button hx-get="{% if p.detail_url %}{{ p.detail_url }}{% else %}{% url detail_url_name pk=p.pk %}{% endif %}" data-plot-status="{{ p.plot_status }}" class="plot-btn" title="{{ section_constant }} - Plot {{ p.plot_id }}">{{ p.plot_id }}</button></td>{% endlocalize %}
