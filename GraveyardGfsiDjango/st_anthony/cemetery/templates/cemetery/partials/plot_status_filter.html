{% comment %}
Behaviour for the status filter checkboxes in plot_section_stats.html. Include once per page,
outside the swapped section view. The hidden statuses live on <body data-hide-statuses>, so
they survive section tab switches and OOB stat refreshes; new checkboxes are synced on load.
{% endcomment %}
<style>
    body[data-hide-statuses~="Available"] [data-plot-status="Available"],
    body[data-hide-statuses~="Reserved"] [data-plot-status="Reserved"],
    body[data-hide-statuses~="Occupied"] [data-plot-status="Occupied"],
    body[data-hide-statuses~="Unknown"] [data-plot-status="Unknown"] {
        opacity: 0.2;
        filter: grayscale(0.6);
    }
</style>
<script>
(function () {
    const body = document.body;
    function getHidden() {
        return new Set((body.dataset.hideStatuses || '').split(/\s+/).filter(Boolean));
    }
    function setHidden(set) {
        if (set.size === 0) {
            delete body.dataset.hideStatuses;
        } else {
            body.dataset.hideStatuses = [...set].join(' ');
        }
    }
    document.addEventListener('change', function (event) {
        const box = event.target.closest('[data-status-filter]');
        if (!box) return;
        const hidden = getHidden();
        if (box.checked) {
            hidden.delete(box.value);
        } else {
            hidden.add(box.value);
        }
        setHidden(hidden);
    });
    htmx.onLoad(function (root) {
        const hidden = getHidden();
        root.querySelectorAll('[data-status-filter]').forEach(function (box) {
            box.checked = !hidden.has(box.value);
        });
    });
})();
</script>
