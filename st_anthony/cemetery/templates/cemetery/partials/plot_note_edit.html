<div id="plot-note-section" class="mb-4">
    <h4 class="text-base font-bold text-gray-700 mb-2 border-b pb-1">Note</h4>

    <form hx-post="{% url 'edit_note' pk=plot.pk %}"
          hx-target="#plot-note-section"
          hx-swap="outerHTML"
          data-dirty-tracked
          class="space-y-2 text-sm">
        {% csrf_token %}

        <textarea name="note" maxlength="4000" rows="4" required
                  class="w-full border border-gray-200 rounded-lg px-2.5 py-1.5 text-sm focus:ring-2 focus:ring-sky-700 focus:outline-none"
                  placeholder="Enter a note for this plot">{% if form_data %}{{ form_data.note }}{% else %}{{ plot.note.note|default:'' }}{% endif %}</textarea>
        {% if errors.note %}<p class="text-red-600">{{ errors.note }}</p>{% endif %}

        <div class="flex gap-2 pt-1">
            <button type="submit"
                    class="bg-emerald-700 hover:bg-emerald-800 text-white px-3 py-1.5 rounded-lg transition-colors">
                Save
            </button>
            <button type="button"
                    hx-get="{% url 'note_section' pk=plot.pk %}"
                    hx-target="#plot-note-section"
                    hx-swap="outerHTML"
                    class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-3 py-1.5 rounded-lg transition-colors">
                Cancel
            </button>
        </div>
    </form>
</div>
