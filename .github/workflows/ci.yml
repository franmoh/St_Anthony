name: CI

on:
  push:
  pull_request:

jobs:
  django-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: GraveyardGfsiDjango/st_anthony

    env:
      SECRET_KEY: ci-dummy-secret-not-for-prod
      DB_NAME: cemetery
      DB_USER: ci
      DB_PASSWORD: ci
      DB_HOST: localhost
      DB_PORT: "3306"

    steps:
      - uses: actions/checkout@v5

      - name: Install MySQL client headers
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config build-essential

      - name: Set up Node (for django-tailwind system checks)
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install uv + Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Django system check
        run: uv run python manage.py check
